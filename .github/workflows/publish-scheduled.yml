name: Publish scheduled blog posts

# Runs every day. Any post in _scheduled/ whose date has arrived (America/New_York)
# is moved live, added to blog.html and sitemap.xml, and committed. Vercel deploys the push.
# Edit _scheduled/schedule.json to reorder or re-date posts; edit _scheduled/<slug>.html to change copy.
# "Run workflow" in the Actions tab publishes anything due right now.

on:
  schedule:
    # GitHub's scheduler runs these 4-9 hours late on this repo (observed Oct 26 - Nov 2), so the
    # job is scheduled six times a day on off-peak minutes. The first one to actually run after
    # midnight Eastern publishes that day's post; every later run is an idempotent no-op.
    - cron: '7 5 * * *'     # 05:07 UTC = 00:07 EST
    - cron: '7 8 * * *'     # 08:07 UTC = 03:07 EST
    - cron: '7 11 * * *'    # 11:07 UTC = 06:07 EST
    - cron: '7 14 * * *'    # 14:07 UTC = 09:07 EST
    - cron: '7 17 * * *'    # 17:07 UTC = 12:07 EST
    - cron: '7 20 * * *'    # 20:07 UTC = 15:07 EST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-scheduled
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish posts that are due
        id: pub
        run: node scripts/publish-scheduled.js

      - name: Commit and push
        if: steps.pub.outputs.published != ''
        run: |
          git config user.name "micahjacobi-publisher"
          git config user.email "publisher@users.noreply.github.com"
          git add -A
          git commit -m "Publish scheduled post(s): ${{ steps.pub.outputs.published }}"
          git push
