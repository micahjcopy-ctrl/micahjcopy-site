name: Publish scheduled blog posts

# Runs every day. Any post in _scheduled/ whose date has arrived (America/New_York)
# is moved live, added to blog.html and sitemap.xml, and committed. Vercel deploys the push.
# Edit _scheduled/schedule.json to reorder or re-date posts; edit _scheduled/<slug>.html to change copy.
# "Run workflow" in the Actions tab publishes anything due right now.

on:
  schedule:
    - cron: '15 14 * * *'   # 14:15 UTC daily = 10:15am EDT / 9:15am EST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-scheduled
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish posts that are due
        id: pub
        run: node scripts/publish-scheduled.js

      - name: Commit and push
        if: steps.pub.outputs.published != ''
        run: |
          git config user.name "micahjacobi-publisher"
          git config user.email "publisher@users.noreply.github.com"
          git add -A
          git commit -m "Publish scheduled post(s): ${{ steps.pub.outputs.published }}"
          git push
